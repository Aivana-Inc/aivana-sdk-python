name: Production smoke test steps
description: >
  Builds the wheel, installs it into a fresh virtual environment and runs smoke/smoke.py against the production API
  (what it checks and why is in .github/workflows/smoke.yml and smoke/README.md).

# The steps are shared by the two jobs that run the smoke test, which are the manual workflow (smoke.yml) and the
# release gate (the `smoke` job in publish.yml). Both are ordinary jobs that declare `environment: production-smoke`,
# so each reads that environment's secret itself and hands it to this action as an input.
#
# It is NOT a reusable workflow on purpose. A reusable workflow called from publish.yml did not receive the
# environment's secret: the first Node release run (v0.8.0) failed with the key empty, while the same steps run
# directly by hand had it. A composite action runs inside the calling job, so there is nothing to pass across.
#
# The key is an input, never read from the secrets context here (a composite action cannot), and it reaches only
# the two steps that run the script, never the build or install steps.

inputs:
  api-key:
    description: The test account's API key, from the calling job's production-smoke environment secret.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # What gets tested is the built wheel, not the source: a module missing from the package, or a broken
    # entry point, shows up here and nowhere in the in-repo tests.
    - name: Build the wheel and install it into a fresh environment
      shell: bash
      run: |
        pip install build
        python -m build --wheel --outdir "$RUNNER_TEMP/wheel"
        python -m venv "$RUNNER_TEMP/smoke-venv"
        "$RUNNER_TEMP/smoke-venv/bin/pip" install --quiet "$RUNNER_TEMP"/wheel/aivana-*.whl
        mkdir -p "$RUNNER_TEMP/smoke-run"
        cp smoke/smoke.py "$RUNNER_TEMP/smoke-run/smoke.py"
        echo "SMOKE_PY=$RUNNER_TEMP/smoke-venv/bin/python" >> "$GITHUB_ENV"
        echo "SMOKE_DIR=$RUNNER_TEMP/smoke-run" >> "$GITHUB_ENV"
        echo "EXPECTED_SDK_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" >> "$GITHUB_ENV"

    # Costs nothing and calls nothing: catches a missing key or a bad address before the real run.
    - name: Check the setup (no calls)
      shell: bash
      working-directory: ${{ env.SMOKE_DIR }}
      env:
        AIVANA_API_KEY: ${{ inputs.api-key }}
      run: ${{ env.SMOKE_PY }} smoke.py --dry-run

    - name: Run the smoke test against production
      shell: bash
      working-directory: ${{ env.SMOKE_DIR }}
      env:
        AIVANA_API_KEY: ${{ inputs.api-key }}
      run: ${{ env.SMOKE_PY }} smoke.py
