name: Production smoke test

# Does the SDK, exactly as a developer would install it, work against the real Aivana API?
#
# It builds the wheel, installs it into a fresh virtual environment (not the source tree) and runs
# smoke/smoke.py from an empty folder against https://api.aivana.ai: free checks and three tiny billed
# calls (smoke/smoke.py lists them and caps the billed ones).
#
# This workflow is the by-hand way to run it: Actions > Production smoke test > Run workflow, before cutting a release
# or the day before an event. The release gate in publish.yml runs the same steps (the shared composite action
# .github/actions/production-smoke), as a job of its own, because a reusable workflow does not receive this
# environment's secret.
#
# SAFETY. The job holds a real production API key, so:
#   - it never runs for a pull request (there is no pull_request trigger, and a workflow a fork's pull request
#     edits cannot start this one);
#   - the key lives in the `production-smoke` ENVIRONMENT, not in repository secrets. In Settings > Environments,
#     add required reviewers and limit "Deployment branches and tags" to `main` and `v*`, so nobody can run this
#     job, or read its secret, from an arbitrary branch;
#   - the job has read-only access to the repository and NO `id-token` permission, so it cannot publish to PyPI or
#     impersonate this repository anywhere;
#   - the key is given to the steps that need it and is hidden in every log line (GitHub masks it, and the
#     script redacts it again);
#   - only one run at a time (the concurrency group), so two runs never spend the test wallet together.
#
# The environment's secrets (see smoke/README.md):
#   AIVANA_API_KEY   a key for a dedicated, permanent test account that is kept funded (smoke/README.md: funding and rotation),
#                    with the default scopes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run the production smoke test
        uses: ./.github/actions/production-smoke
        with:
          api-key: ${{ secrets.AIVANA_API_KEY }}
