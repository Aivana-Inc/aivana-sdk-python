name: Basic Chat download (Python)

# Builds the Python Basic AI Chat starter's standalone download, then checks the EXTRACTED copy the way a customer would run
# it: on Linux, macOS and Windows, with Python 3.11, 3.12 and 3.13, from a folder whose name has spaces in it, with fresh
# dependencies installed from the package's own requirements.txt. Nothing here uses an API key or spends credit: the check
# talks to a stand-in for the API (examples/basic-chat/tools/verify_package.py).
#
# To publish a download:
#   1. Release the SDK (RELEASING.md): the starter must be part of a tagged release.
#   2. Actions > Basic Chat download (Python) > Run workflow, choosing that TAG in "Use workflow from".
#   3. Open the run's summary. It shows the inner ZIP's SHA-256. Download the artifact below it, unzip it ONCE (the artifact is
#      a ZIP wrapped around the real ZIP) and review the inner aivana-basic-chat-python.zip.
#   4. Attach the inner file to that release (Edit release > the "Attach binaries" strip, not the description box).
#   5. The release file's digest shown by GitHub must equal the SHA-256 in the run summary.
# A workflow artifact is not a public release: it expires, and nobody outside the repository can open it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "examples/basic-chat/**"
      - ".github/workflows/basic-chat-download.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r examples/basic-chat/requirements-dev.txt

      # The packaging tests include running the verification on a freshly built package.
      - name: Packaging tests
        run: python -m pytest tests/test_package.py -q
        working-directory: examples/basic-chat

      - name: Build the download
        run: |
          python examples/basic-chat/tools/package_starter.py aivana-basic-chat-python
          python -m zipfile -c aivana-basic-chat-python.zip aivana-basic-chat-python

      - name: Say what to attach, and its checksum
        run: |
          sha="$(sha256sum aivana-basic-chat-python.zip | cut -d' ' -f1)"
          size="$(stat -c%s aivana-basic-chat-python.zip)"
          {
            echo "## Python starter download candidate"
            echo
            echo "- File: \`aivana-basic-chat-python.zip\` ($size bytes)"
            echo "- SHA-256: \`$sha\`"
            echo "- Built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`"
            echo
            echo "The artifact below is a ZIP wrapped around that file. Download it, unzip it once, and attach the inner"
            echo "\`aivana-basic-chat-python.zip\` to the release. When it is attached, GitHub shows the release file's digest:"
            echo "it must equal the SHA-256 above."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: basic-chat-python-candidate
          path: aivana-basic-chat-python.zip
          if-no-files-found: error

  installed:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      # Only for tools/verify_package.py. The starter itself comes from the downloaded ZIP, never from this checkout.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: basic-chat-python-candidate
          path: download

      - name: Extract into a folder with spaces in its name
        run: python -m zipfile -e download/aivana-basic-chat-python.zip "extracted with spaces"

      - name: Install the package's own requirements into a fresh environment
        working-directory: extracted with spaces/aivana-basic-chat-python
        run: |
          python -m venv venv
          if [ -f venv/Scripts/python.exe ]; then PY=venv/Scripts/python.exe; else PY=venv/bin/python; fi
          echo "$PY" > venv-python.txt
          "$PY" -m pip install -r requirements.txt

      - name: Verify the extracted download
        working-directory: extracted with spaces/aivana-basic-chat-python
        run: |
          PY="$(cat venv-python.txt)"
          "$PY" ../../examples/basic-chat/tools/verify_package.py .
