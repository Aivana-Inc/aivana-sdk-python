name: CI

on:
  push:
    # fix/api-parity stays listed until the default branch is renamed to main.
    branches: [main, fix/api-parity]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml promises.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Installing the package, not just its dependencies, also installs the
      # `aivana` command, so the last step exercises the real entry point.
      - run: pip install . pytest

      # Includes the shared CLI conformance suite (conformance/cli.json), which
      # the Node CLI in aivana-sdk-node runs too.
      - run: python -m pytest tests -q

      - name: The installed aivana command runs
        run: aivana --version

  # One fixed check name, `lint-and-build`, so a single org-level ruleset can
  # require it in every code repo. Don't rename it, and keep it separate from
  # the `test` matrix above. The repo has no ruff configuration, so lint is
  # ruff's conservative set (syntax errors, broken string formats, invalid
  # comparisons, undefined names); build is the real sdist and wheel build.
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          pip install ruff==0.6.9
          ruff check --select E9,F63,F7,F82 .

      - name: Build the sdist and wheel
        run: |
          pip install build
          python -m build
