[project]
name = "aivana"
version = "0.2.0"
description = "Aivana Intelligence API — Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai", "llm", "intelligence", "api", "aivana"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

# The `aivana` command-line tool (aivana/cli.py). It ships in the same package as
# the SDK and adds no dependencies; `python -m aivana` runs the same program.
[project.scripts]
aivana = "aivana.cli:main"

[project.urls]
Homepage = "https://github.com/Aivana-Inc/aivana-sdk-python"
Repository = "https://github.com/Aivana-Inc/aivana-sdk-python"
Issues = "https://github.com/Aivana-Inc/aivana-sdk-python/issues"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aivana*"]

# PEP 561: without this marker mypy and pyright ignore the inline annotations in
# an INSTALLED copy of the package, so the `Typing :: Typed` classifier above
# would be a claim the wheel does not back up.
[tool.setuptools.package-data]
aivana = ["py.typed"]

# Only tests/ is the suite. examples/ holds a live harness that calls the real
# API, so a bare `pytest` at the repo root used to fail on connection-refused.
[tool.pytest.ini_options]
testpaths = ["tests"]
